<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HistoryMaP - Explore historical events on an interactive world map">
    <title>HistoryMaP - Historical Events Interactive Map</title>

    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🗺️ HistoryMaP</h1>
            <p>Explore historical events on an interactive world map</p>
        </header>

        <main>
            <section class="search-section" aria-label="Search locations">
                <input type="text" id="search-input" placeholder="Search for a location..." aria-label="Search for a location" autocomplete="off">
            </section>

            <section class="map-container" aria-label="Map and location cards">
                <div class="map-stage">
                    <div id="world-map" role="img" aria-label="Interactive world map showing locations of historical events"></div>
                    <div id="map-status" class="map-status map-status--loading" role="status" aria-live="polite">
                        <div class="map-status__inner">
                            <div class="map-status__spinner" aria-hidden="true"></div>
                            <p id="map-status-message">Loading events…</p>
                            <button id="map-retry" type="button" class="map-status__retry" hidden>Retry</button>
                        </div>
                    </div>
                </div>

                <div class="location-cards" id="location-cards" aria-label="Location cards"></div>
            </section>

            <aside class="details-panel" id="details-panel" aria-label="Event details">
                <h2 id="panel-title">Select a location</h2>
                <div id="period-tabs" aria-label="Historical periods">
                    <button type="button" class="tab-btn" data-period="ancient" aria-current="true">Ancient</button>
                    <button type="button" class="tab-btn" data-period="medieval" aria-current="false">Medieval</button>
                    <button type="button" class="tab-btn" data-period="modern" aria-current="false">Modern</button>
                </div>
                <div id="period-content">
                    <h3 id="period-title">Click a marker or a card to view historical details.</h3>
                    <ul id="facts-list"></ul>
                </div>
            </aside>
        </main>

        <footer>
            <p>HistoryMaP &copy; 2026 - Interactive Historical Events Explorer</p>
        </footer>
    </div>

    <!-- Leaflet.js JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
