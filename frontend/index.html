<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HistoryMaP - Historical Events Interactive Map</title>
    
    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🗺️ HistoryMaP</h1>
            <p>Explore historical events by clicking on world locations</p>
        </header>

        <main>
            <section class="search-section">
                <input type="text" id="search-input" placeholder="Search for a location...">
            </section>

            <section class="map-container">
                <!-- Leaflet map will be rendered here -->
                <div id="world-map"></div>
                
                <!-- Keep grid as fallback/alternative view -->
                <div class="location-cards-fallback" id="location-cards">
                    <!-- Cards will be populated by JavaScript -->
                </div>
            </section>

            <aside class="details-panel" id="details-panel">
                <h2 id="panel-title"></h2>
                <div id="period-tabs">
                    <button class="tab-btn" data-period="ancient">Ancient</button>
                    <button class="tab-btn" data-period="medieval">Medieval</button>
                    <button class="tab-btn" data-period="modern">Modern</button>
                </div>
                <div id="period-content">
                    <h3 id="period-title"></h3>
                    <ul id="facts-list"></ul>
                </div>
            </aside>
        </main>

        <footer>
            <p>HistoryMaP &copy; 2026 - Interactive Historical Events Explorer</p>
        </footer>
    </div>

    <!-- Leaflet.js JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
